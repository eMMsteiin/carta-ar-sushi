<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nossa carta</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a0a; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #scene-container {
    position: fixed; inset: 0; width: 100%; height: 100%;
  }
  #scene-container video,
  #scene-container canvas.ar-canvas,
  #scene-container img.frozen-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    object-fit: cover;
  }

  /* ---------- Intro overlay ---------- */
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 24px;
    box-sizing: border-box;
    background: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #000 100%);
    color: #fdf6ee;
    z-index: 30;
    transition: opacity 0.5s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; letter-spacing: 0.3px; }
  #overlay p { font-size: 15px; line-height: 1.5; color: #cfc4b6; margin: 0 0 28px; max-width: 320px; }
  #start-btn {
    background: linear-gradient(135deg, #ff8a3d, #ff5f6d);
    color: white; border: none; border-radius: 999px;
    padding: 16px 36px; font-size: 16px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(255, 95, 109, 0.35);
    cursor: pointer;
  }
  #start-btn:active { transform: scale(0.97); }
  #error-box { display: none; margin-top: 20px; font-size: 13px; color: #ff9c9c; max-width: 300px; }

  /* ---------- Capture guide ---------- */
  #guide-frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 78vh);
    height: min(78vw, 78vh);
    border: 3px solid rgba(255,255,255,0.85);
    border-radius: 24px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    z-index: 12;
    pointer-events: none;
    transition: opacity 0.3s ease, border-color 0.3s ease;
  }
  #guide-frame.hidden { opacity: 0; }
  #guide-frame::before,
  #guide-frame::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 24px;
  }

  #capture-hint {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    padding: 16px 24px 10px;
    text-align: center;
    color: #fff;
    font-size: 14px;
    line-height: 1.4;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
    z-index: 13;
    transition: opacity 0.3s ease;
  }
  #capture-hint.hidden { opacity: 0; pointer-events: none; }

  #capture-btn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 14;
    width: 72px; height: 72px;
    border-radius: 999px;
    background: #fff;
    border: 4px solid rgba(255,255,255,0.5);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: opacity 0.3s ease, transform 0.15s ease;
  }
  #capture-btn:active { transform: translateX(-50%) scale(0.9); }
  #capture-btn.hidden { opacity: 0; pointer-events: none; }

  /* ---------- Analyzing state ---------- */
  #analyzing {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 16;
    color: #fff;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #analyzing.visible { opacity: 1; pointer-events: auto; }
  .spinner {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #ff8a3d;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #analyzing span { font-size: 14px; color: #eee; }

  /* ---------- Result ---------- */
  #caption {
    position: fixed;
    left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    padding: 18px 24px 28px;
    text-align: center;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    background: linear-gradient(0deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    z-index: 10;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #caption.visible { opacity: 1; }

  #action-bar {
    position: fixed;
    right: 0; left: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 15;
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #action-bar.visible { opacity: 1; pointer-events: auto; }
  .pill-btn {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>Para minha madame 🍣</h1>
  <p>Enquadre o sushi desenhado na carta dentro do quadro e toque no botão para capturar. Vamos pedir permissão para a câmera e para os sensores de movimento.</p>
  <button id="start-btn">Abrir a câmera</button>
  <div id="error-box"></div>
</div>

<div id="scene-container"></div>

<div id="capture-hint">Alinhe o sushi dentro do quadro</div>
<div id="guide-frame"></div>
<button id="capture-btn" aria-label="Capturar"></button>

<div id="analyzing">
  <div class="spinner"></div>
  <span>Procurando o sushi...</span>
</div>

<div id="caption"></div>
<div id="action-bar">
  <button class="pill-btn" id="retry-btn">Tentar de novo</button>
  <button class="pill-btn" id="reload-btn">Trocar foto</button>
</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/target/sushi-mind-data.js"></script>
<script type="module">
import "./assets/mindar-image.prod.js";

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

const PHOTOS = [
  { file: "assets/photos/foto01.jpg", caption: "Você é minha madame para a vida!!" },
  { file: "assets/photos/foto02.jpg", caption: "É um privilégio acordar ao seu lado, madame!!" },
  { file: "assets/photos/foto03.jpg", caption: "Você me completa" },
  { file: "assets/photos/foto04.jpg", caption: "Te amo mil milhões" },
  { file: "assets/photos/foto05.jpg", caption: "Seus olhos são a minha paisagem favorita" },
  { file: "assets/photos/foto06.jpg", caption: "Seu apoio é a minha maior motivação" },
  { file: "assets/photos/foto07.jpg", caption: "Você é a minha maior benção!!" },
  { file: "assets/photos/foto08.jpg", caption: "Você faz a palavra amor ganhar um significado diferente a cada dia" },
  { file: "assets/photos/foto09.jpg", caption: "" },
];

const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("start-btn");
const errorBox = document.getElementById("error-box");
const container = document.getElementById("scene-container");
const guideFrame = document.getElementById("guide-frame");
const captureHint = document.getElementById("capture-hint");
const captureBtn = document.getElementById("capture-btn");
const analyzing = document.getElementById("analyzing");
const caption = document.getElementById("caption");
const actionBar = document.getElementById("action-bar");
const retryBtn = document.getElementById("retry-btn");
const reloadBtn = document.getElementById("reload-btn");

let lastPhotoIndex = -1;
function pickPhoto() {
  if (PHOTOS.length === 1) return PHOTOS[0];
  let idx;
  do { idx = Math.floor(Math.random() * PHOTOS.length); } while (idx === lastPhotoIndex);
  lastPhotoIndex = idx;
  return PHOTOS[idx];
}

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = "Abrindo...";
  errorBox.style.display = "none";

  try {
    // Must run inside this tap (iOS requires a user gesture for motion
    // sensors). If it's denied we still work, just without the gyro assist.
    await enableSensors();
    await initCamera();
    overlay.classList.add("hidden");
    setTimeout(() => { overlay.style.display = "none"; }, 550);
    captureHint.classList.remove("hidden");
    guideFrame.classList.remove("hidden");
    captureBtn.classList.remove("hidden");
  } catch (err) {
    console.error(err);
    errorBox.style.display = "block";
    errorBox.textContent = humanizeError(err);
    startBtn.disabled = false;
    startBtn.textContent = "Tentar de novo";
  }
}

function humanizeError(err) {
  const msg = (err && err.message) || String(err);
  if (msg.includes("Permission") || msg.includes("NotAllowed")) {
    return "Precisamos da permissão da câmera. Verifique as configurações do navegador e tente de novo.";
  }
  if (msg.includes("NotFoundError")) {
    return "Não encontrei uma câmera neste dispositivo.";
  }
  return "Algo deu errado ao abrir a câmera: " + msg;
}

let video, controller, inputWidth, inputHeight;
let renderer, scene, camera3, anchor, pivot, standRoot, plane, planeMat, glow, glowMat;
let mindTargetDims = null;
let lastResultWasAR = false;
let isTracking = false; // true once continuous live tracking has taken over after the initial capture

// ---------------------------------------------------------------------------
// Gyroscope + camera fusion ("world lock")
//
// The camera-based detection only runs a few times a second, so on its own
// the photo would lag and jump when the phone moves. Games like Pokémon GO
// keep the object nailed to the real world by combining the camera with the
// phone's gyroscope: the gyro reports how the phone *rotated* at 60 Hz, and
// the camera occasionally corrects where the object actually is.
//
// We do the same. Every detection gives the marker's pose in the camera's
// frame. We convert it to an earth-aligned frame using the phone's
// orientation at the instant that frame was captured (poseTarget). Each
// rendered frame we convert it back using the phone's orientation *now*, so
// pure rotations of the phone are followed instantly and smoothly, and the
// photo stays put on the drawing, even when the drawing leaves the frame.
// Moving the phone closer/farther/sideways (translation) can't be sensed by
// the gyro, so that part still relies on the camera detections.
// ---------------------------------------------------------------------------
const DEG = Math.PI / 180;
const _euler = new THREE.Euler();
const _qScreen = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // camera looks out the back, not the top
const _qOrient = new THREE.Quaternion();
const _zAxis = new THREE.Vector3(0, 0, 1);

// Camera orientation (three.js convention: looks down -Z, +Y up) in the
// earth frame, from the W3C deviceorientation angles. Same maths as three's
// classic DeviceOrientationControls.
function deviceQuat(alphaDeg, betaDeg, gammaDeg, screenAngleRad, out) {
  _euler.set(betaDeg * DEG, alphaDeg * DEG, -gammaDeg * DEG, "YXZ");
  out.setFromEuler(_euler);
  out.multiply(_qScreen);
  out.multiply(_qOrient.setFromAxisAngle(_zAxis, -screenAngleRad));
  return out;
}

const deviceQ = new THREE.Quaternion();
let sensorsEnabled = false; // permission granted / API available
let orientationSeen = false; // at least one real (non-null) reading arrived

function screenAngleRad() {
  const a = (screen.orientation && typeof screen.orientation.angle === "number")
    ? screen.orientation.angle
    : (window.orientation || 0);
  return a * DEG;
}

function onDeviceOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  deviceQuat(e.alpha, e.beta, e.gamma, screenAngleRad(), deviceQ);
  if (!orientationSeen) {
    orientationSeen = true;
    // A pose stored before the gyro woke up used the "no gyro" frame; drop it
    // so the very next detection re-establishes it consistently.
    havePose = false;
  }
}

function gyroActive() {
  return sensorsEnabled && orientationSeen;
}

// Current camera orientation, or identity when there is no gyroscope (then
// the fusion degrades gracefully to plain camera-only tracking).
function currentCamQuat(out) {
  if (gyroActive()) out.copy(deviceQ); else out.identity();
  return out;
}

// iOS only delivers motion data after an explicit permission prompt, which
// must be triggered from a tap — we call this straight from the start button.
async function enableSensors() {
  try {
    if (typeof DeviceOrientationEvent === "undefined") return false;
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") return false;
    }
    window.addEventListener("deviceorientation", onDeviceOrientation, true);
    sensorsEnabled = true;
    return true;
  } catch (err) {
    console.warn("Sensores de movimento indisponíveis", err);
    return false;
  }
}

// Fused pose state. poseTarget* is the latest detection expressed in the
// earth-aligned frame; poseCur* chases it (low-pass) so correction jumps from
// a new detection are absorbed smoothly, without slowing down the gyro part.
const _mDet = new THREE.Matrix4();
const _mRot = new THREE.Matrix4();
const _mCur = new THREE.Matrix4();
const _qInv = new THREE.Quaternion();
const _qNow = new THREE.Quaternion();
const poseTarget = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3(1, 1, 1) };
const poseCur = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3(1, 1, 1) };
let havePose = false;
let lastDetectAt = 0;
let lastFrameAt = 0;
const POSE_SMOOTH_TAU = 0.08; // seconds; time constant of the correction smoothing
const HIDE_AFTER_MS_GYRO = 4000; // gyro keeps it in place for a while even if the drawing leaves view
const HIDE_AFTER_MS_VISION = 1500; // camera-only: don't leave a stale photo hanging around

async function initCamera() {
  video = document.createElement("video");
  video.setAttribute("autoplay", "");
  video.setAttribute("muted", "");
  video.setAttribute("playsinline", "");
  video.muted = true;
  container.appendChild(video);

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
  });
  video.srcObject = stream;
  await new Promise((resolve) => {
    video.onloadedmetadata = () => { video.play(); resolve(); };
  });

  inputWidth = video.videoWidth;
  inputHeight = video.videoHeight;
  applyCoverTransform(video, inputWidth, inputHeight);
  window.addEventListener("resize", () => applyCoverTransform(video, inputWidth, inputHeight));

  // Prepare (but don't start) the MindAR controller + three.js scene now,
  // so detection can run instantly once the user captures a frame.
  //
  // We deliberately don't use MindAR's built-in continuous tracking
  // (controller.processVideo + onUpdate) here: testing showed its internal
  // tracker reliably fails to (re)acquire the target after a handoff from a
  // one-shot detection — the hologram would end up stuck to the screen
  // instead of the drawing, which matches what happened on a real phone
  // too, not just in this sandbox. Instead, startLiveTracking() below runs
  // our own loop that repeatedly calls the same robust detect()/match()
  // pair used for the initial capture (tryDetect) directly on live video
  // frames, a few times a second. It's not as buttery smooth as true
  // per-frame tracking, but it's the method that has actually proven
  // reliable, both here and for the initial capture.
  const { Controller } = window.MINDAR.IMAGE;
  controller = new Controller({ inputWidth, inputHeight, maxTrack: 1, onUpdate: () => {} });
  const mindBuffer = base64ToArrayBuffer(window.__SUSHI_MIND_B64__);
  const targets = controller.addImageTargetsFromBuffer(mindBuffer);
  const dims = targets && targets.dimensions && targets.dimensions[0];
  mindTargetDims = dims ? { width: dims[0], height: dims[1] } : { width: 500, height: 500 };
  controller.dummyRun(video);
}

function applyCoverTransform(el, w, h) {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const scale = Math.max(screenW / w, screenH / h);
  el.style.width = w + "px";
  el.style.height = h + "px";
  el.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function setupThreeScene() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(inputWidth, inputHeight, false);
  renderer.domElement.classList.add("ar-canvas");
  container.appendChild(renderer.domElement);
  applyCoverTransform(renderer.domElement, inputWidth, inputHeight);
  window.addEventListener("resize", () => applyCoverTransform(renderer.domElement, inputWidth, inputHeight));

  scene = new THREE.Scene();
  camera3 = new THREE.PerspectiveCamera();
  scene.add(camera3);
  // Derive a standard perspective camera (fov/near/far) from MindAR's raw
  // projection matrix, exactly like the official three.js wrapper does,
  // instead of assigning the raw matrix directly to a generic THREE.Camera
  // (which only works if the canvas is pixel-for-pixel inputWidth x
  // inputHeight with no extra CSS scaling involved in the math).
  const projMat = controller.getProjectionMatrix();
  camera3.fov = 2 * Math.atan(1 / projMat[5]) * 180 / Math.PI;
  camera3.near = projMat[14] / (projMat[10] - 1);
  camera3.far = projMat[14] / (projMat[10] + 1);
  camera3.aspect = inputWidth / inputHeight;
  camera3.updateProjectionMatrix();

  anchor = new THREE.Group();
  anchor.matrixAutoUpdate = false;
  anchor.visible = false; // shown by renderFrame once a pose has been detected
  scene.add(anchor);

  // MindAR's raw worldMatrix places things in the *target image's own
  // pixel space* (e.g. 0..500 for our 500x500 sushi drawing), not a
  // normalized 0..1 marker space. The official three.js wrapper corrects
  // for this with a fixed "postMatrix" per target: position at
  // (p/2, p/2 + (m-p)/2, 0) and scale (p, p, p), where [p, m] are the
  // target's [width, height] in pixels. We replicate that exactly via
  // this pivot group instead of guessing our own normalized convention.
  const p = mindTargetDims.width;
  const m = mindTargetDims.height;
  pivot = new THREE.Group();
  pivot.position.set(p / 2, p / 2 + (m - p) / 2, 0);
  pivot.scale.set(p, p, p);
  anchor.add(pivot);

  // The photo stands upright above the drawing, like a hologram rising off
  // the page, instead of lying flat/coplanar with the paper. "standRoot" is
  // a child of `pivot` (not `anchor`) so it correctly inherits the marker's
  // own tracked orientation — the paper's surface normal already points
  // roughly at the camera, which is exactly why the original flat "sticker"
  // version was visible at all; building the stand-up transform in world
  // space instead of the marker's own local space threw that orientation
  // away, which is why the plane ended up lying flat/edge-on.
  //
  // `pivot` itself carries a `p`-scale (see above) that turns "1 unit" in
  // its local space into "the marker's full width" in world space — the
  // same convention the original flat/coplanar version used for sizing the
  // photo (e.g. width 0.9 = 90% of the marker's width). We keep that exact
  // convention here: standRoot rotates about local X (turning the marker's
  // in-plane "up", local Y, into "out of the paper"), with no extra scale
  // of its own, so plane/glow sizes below stay in the same "fraction of
  // marker size" units as before.
  //
  // A full 90° tilt stands the photo perfectly perpendicular to the paper —
  // which looks right side-on, but collapses to an invisible hairline the
  // moment the camera looks straight down at the page (exactly the common
  // case: someone holding a phone over a letter on a table/in their hands).
  // Real "AR photo card" effects lean the standing card back a bit, like a
  // photo propped against something, so it stays legible across viewing
  // angles instead of only from a steep side angle.
  const STAND_TILT_DEG = 55; // 90 = perfectly upright, 0 = flat on the paper
  standRoot = new THREE.Group();
  standRoot.rotation.x = (STAND_TILT_DEG * Math.PI) / 180;
  pivot.add(standRoot);

  planeMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide });
  plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), planeMat);
  standRoot.add(plane);

  // Soft glow disc at the base, like a light pooling under the hologram.
  // Lies flat on the paper, so it's a direct child of `pivot` (the marker's
  // own flat plane) with no extra rotation needed.
  glowMat = new THREE.MeshBasicMaterial({
    color: 0xfff3e0, transparent: true, opacity: 0,
    side: THREE.DoubleSide, depthWrite: false,
  });
  glow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 32), glowMat);
  pivot.add(glow);

  lastFrameAt = performance.now();
  renderer.setAnimationLoop(renderFrame);
}

// Register a fresh detection. `worldMatrix` is MindAR's marker pose in the
// camera's frame; `qCap` is the phone's orientation at the moment the
// analysed frame was captured (not when the result arrived — detection takes
// a few hundred ms, and the phone keeps rotating meanwhile).
function setDetectedPose(worldMatrix, qCap) {
  _mDet.fromArray(worldMatrix);
  _mRot.makeRotationFromQuaternion(qCap);
  _mCur.multiplyMatrices(_mRot, _mDet); // camera frame -> earth-aligned frame
  _mCur.decompose(poseTarget.p, poseTarget.q, poseTarget.s);
  if (!havePose) {
    poseCur.p.copy(poseTarget.p);
    poseCur.q.copy(poseTarget.q);
    poseCur.s.copy(poseTarget.s);
    havePose = true;
  }
  lastDetectAt = performance.now();
}

// Runs every display frame: chase the latest detection, convert to the
// camera frame using the phone's *current* orientation, and draw.
function renderFrame() {
  if (havePose && anchor) {
    const now = performance.now();
    const dt = Math.min(0.1, (now - lastFrameAt) / 1000);
    lastFrameAt = now;
    const a = 1 - Math.exp(-dt / POSE_SMOOTH_TAU);
    poseCur.p.lerp(poseTarget.p, a);
    poseCur.q.slerp(poseTarget.q, a);
    poseCur.s.lerp(poseTarget.s, a);
    _mCur.compose(poseCur.p, poseCur.q, poseCur.s);

    currentCamQuat(_qNow);
    _qInv.copy(_qNow).invert();
    _mRot.makeRotationFromQuaternion(_qInv);
    anchor.matrix.multiplyMatrices(_mRot, _mCur); // earth-aligned frame -> camera frame

    const limit = gyroActive() ? HIDE_AFTER_MS_GYRO : HIDE_AFTER_MS_VISION;
    anchor.visible = now - lastDetectAt < limit;
  }
  renderer.render(scene, camera3);
}

// Expressed as a fraction of the marker's own real-world size (mindTargetDims
// is in "pixels" but doubles as anchor-space units via pivot's scale), so
// the photo scales sensibly whatever size the drawing itself is. Kept modest
// since this is a *standing* plane now — its "height" extends away from the
// paper along real depth, and at this scale it also has to fit inside the
// camera's near/far planes without being foreshortened into a sliver.
const PHOTO_WIDTH_RATIO = 0.55;
function loadTexture(url) {
  const loader = new THREE.TextureLoader();
  return new Promise((resolve, reject) => {
    loader.load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;
      resolve(tex);
    }, undefined, reject);
  });
}
async function showPhotoOnPlane(item) {
  const tex = await loadTexture(item.file);
  planeMat.map = tex;
  planeMat.needsUpdate = true;

  const aspect = tex.image.width / tex.image.height;
  const w = PHOTO_WIDTH_RATIO;
  const h = w / aspect;
  plane.scale.set(w, h, 1);
  // Lift the plane so its bottom edge sits on the paper instead of its
  // center — it should rise up out of the drawing, not be bisected by it.
  plane.position.set(0, h / 2, 0);
  glow.scale.set(w * 1.15, h * 1.15, 1);

  // Fade both in together for a soft "materializing" hologram feel rather
  // than popping in instantly.
  await fadeIn([planeMat, glowMat], [1, 0.55], 450);
}

function fadeIn(mats, targets, durationMs) {
  const starts = mats.map((m) => m.opacity);
  const t0 = performance.now();
  return new Promise((resolve) => {
    function step(now) {
      const t = Math.min(1, (now - t0) / durationMs);
      mats.forEach((m, i) => { m.opacity = starts[i] + (targets[i] - starts[i]) * t; });
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

// Freeze the current video frame into a canvas for detection + display.
function captureFrame() {
  const c = document.createElement("canvas");
  c.width = inputWidth;
  c.height = inputHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(video, 0, 0, inputWidth, inputHeight);
  return c;
}

// Try to detect the target on a static frame. Since there's no real-time
// pressure anymore, we can retry a few times (the detector has some
// randomness/robustness variance frame to frame even on a still canvas
// because of internal sampling), giving a much better hit rate than a
// single live-video attempt.
async function tryDetect(canvas, attempts = 5) {
  for (let i = 0; i < attempts; i++) {
    const { featurePoints } = await controller.detect(canvas);
    if (featurePoints && featurePoints.length > 0) {
      const { modelViewTransform } = await controller.match(featurePoints, 0);
      if (modelViewTransform) {
        return modelViewTransform;
      }
    }
    await new Promise((r) => setTimeout(r, 30));
  }
  return null;
}

// Convert MindAR's raw modelViewTransform (3x4, row-major nested array)
// into the 4x4 column-major worldMatrix MindAR normally emits via onUpdate,
// reusing the controller's own private conversion by calling it the same
// way processVideo does internally (getWorldMatrix wraps _glModelViewMatrix).
function toWorldMatrix(modelViewTransform, targetIndex) {
  return controller.getWorldMatrix(modelViewTransform, targetIndex);
}

function freezeBackground(canvas) {
  // Used only for the no-detection fallback path, where there's no live
  // tracking to show — freezing the captured frame there still looks more
  // intentional than an abrupt cut back to a blank/dark screen.
  video.pause();
  video.style.display = "none";
  const img = document.createElement("img");
  img.src = canvas.toDataURL("image/jpeg", 0.9);
  img.className = "frozen-frame";
  container.insertBefore(img, container.firstChild);
  applyCoverTransform(img, inputWidth, inputHeight);
  window.addEventListener("resize", () => applyCoverTransform(img, inputWidth, inputHeight));
}

function stopCameraStream() {
  const stream = video.srcObject;
  if (stream) stream.getTracks().forEach((t) => t.stop());
}

// Hand off from the one-shot still-frame detection to our own continuous
// re-detection loop (see the note above initCamera for why this is used
// instead of MindAR's built-in processVideo). It keeps correcting the
// photo's position from the camera, while the gyroscope (see the fusion
// section above) carries it smoothly between detections.
//
// Each iteration grabs the current video frame and runs the same
// detect()+match() used for the initial capture, but with just 1 attempt
// (not the 6 used for the harder cold-start case) since here we're
// re-detecting a target we just saw a moment ago. It runs back-to-back
// (as fast as the phone can manage) rather than on a fixed timer.
let trackGen = 0; // bumped on stop so an in-flight loop knows to quit

function startLiveTracking() {
  isTracking = true;
  liveTrackLoop(++trackGen);
}

function stopLiveTracking() {
  isTracking = false;
  trackGen++;
}

async function liveTrackLoop(gen) {
  const qCap = new THREE.Quaternion();
  while (isTracking && gen === trackGen) {
    if (video && video.readyState >= 2) {
      try {
        // Record the phone's orientation at the moment this frame is taken;
        // detection takes a few hundred ms and the phone keeps moving.
        currentCamQuat(qCap);
        const canvas = captureFrame();
        const modelViewTransform = await tryDetect(canvas, 1);
        if (gen !== trackGen) return;
        if (modelViewTransform) {
          setDetectedPose(toWorldMatrix(modelViewTransform, 0), qCap);
        }
      } catch (e) {
        console.error("Erro no tracking ao vivo", e);
      }
    }
    await new Promise((r) => setTimeout(r, 30));
  }
}

async function handleCapture() {
  captureHint.classList.add("hidden");
  guideFrame.classList.add("hidden");
  captureBtn.classList.add("hidden");
  analyzing.classList.add("visible");

  const qCap = new THREE.Quaternion();
  currentCamQuat(qCap); // phone orientation at the instant of the captured frame
  const canvas = captureFrame();

  let worldMatrix = null;
  try {
    const modelViewTransform = await tryDetect(canvas, 6);
    if (modelViewTransform) {
      worldMatrix = toWorldMatrix(modelViewTransform, 0);
    }
  } catch (e) {
    console.error("Detecção falhou", e);
  }

  analyzing.classList.remove("visible");

  const item = pickPhoto();
  lastResultWasAR = !!worldMatrix;

  if (worldMatrix) {
    // Keep the camera live: this is what lets the hologram keep following
    // the drawing as the phone moves, instead of being stuck to one frame.
    setupThreeScene();
    setDetectedPose(worldMatrix, qCap);
    await showPhotoOnPlane(item);
    startLiveTracking();
  } else {
    // Fallback: couldn't lock onto the drawing precisely, but we never
    // leave the person with nothing — show the photo centered and large
    // over the captured frame instead of a failure state. There's no
    // tracked position to keep live here, so freeze the frame instead.
    freezeBackground(canvas);
    stopCameraStream();
    showFallbackPhoto(item);
  }

  caption.textContent = item.caption || "";
  caption.classList.toggle("visible", !!item.caption);
  actionBar.classList.add("visible");
}

function showFallbackPhoto(item) {
  const img = document.createElement("img");
  img.src = item.file;
  img.style.position = "fixed";
  img.style.top = "50%";
  img.style.left = "50%";
  img.style.transform = "translate(-50%, -50%)";
  img.style.maxWidth = "80vw";
  img.style.maxHeight = "70vh";
  img.style.borderRadius = "16px";
  img.style.boxShadow = "0 12px 40px rgba(0,0,0,0.6)";
  img.style.zIndex = "11";
  img.className = "fallback-photo";
  container.appendChild(img);
}

function resetToCapture() {
  stopLiveTracking();
  havePose = false;

  // Remove any previous result (three.js canvas, frozen frame, fallback photo)
  const oldCanvas = container.querySelector("canvas.ar-canvas");
  if (oldCanvas) oldCanvas.remove();
  const oldFrozen = container.querySelector("img.frozen-frame");
  if (oldFrozen) oldFrozen.remove();
  const oldFallback = container.querySelector("img.fallback-photo");
  if (oldFallback) oldFallback.remove();
  if (renderer) { renderer.setAnimationLoop(null); renderer = null; }

  caption.classList.remove("visible");
  actionBar.classList.remove("visible");
  video.style.display = "";

  const backToCaptureUi = () => {
    captureHint.classList.remove("hidden");
    guideFrame.classList.remove("hidden");
    captureBtn.classList.remove("hidden");
  };

  // The camera stream is only ever stopped on the no-detection fallback
  // path (see handleCapture) — in the normal AR path the camera stayed
  // live the whole time for continuous tracking, so there's nothing to
  // re-acquire.
  const stream = video.srcObject;
  const streamIsLive = stream && stream.getVideoTracks().some((t) => t.readyState === "live");
  if (streamIsLive) {
    backToCaptureUi();
    return;
  }

  navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
  }).then((stream) => {
    video.srcObject = stream;
    video.play();
    backToCaptureUi();
  });
}

// "Trocar foto": just swap in a different random photo without redoing the
// capture/detection step. If the last result was AR-positioned, keep the
// same locked anchor and only replace the texture on the existing plane.
// If the last result was the fallback (no AR lock), just swap the fallback
// image instead of asking the person to re-frame and capture again.
async function swapPhoto() {
  const item = pickPhoto();

  if (lastResultWasAR && plane) {
    await showPhotoOnPlane(item);
  } else {
    const oldFallback = container.querySelector("img.fallback-photo");
    if (oldFallback) oldFallback.remove();
    showFallbackPhoto(item);
  }

  caption.textContent = item.caption || "";
  caption.classList.toggle("visible", !!item.caption);
}

captureBtn.addEventListener("click", handleCapture);
retryBtn.addEventListener("click", resetToCapture);
reloadBtn.addEventListener("click", swapPhoto);

startBtn.addEventListener("click", start);
</script>
</body>
</html>
